services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: upscaler
      POSTGRES_PASSWORD: upscaler
      POSTGRES_DB: upscaler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upscaler -d upscaler"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://upscaler:upscaler@db:5432/upscaler
      UPLOAD_DIR: /data/uploads
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
